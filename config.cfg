[Bot]
token       = your_token_here

; Seconds of inactivity before the bot exits the channel.
idle_time   = 300

[TTS]
channel             = optional-discord-channel-id
media_msg           = media
default_lang        = es
default_sp          = aiden
default_voice_description = Neutral adult voice, warm tone, moderate pace.

; Seconds of inactivity before the model is unloaded to free VRAM.
; 0 = load at startup and keep it loaded.
unload_after        = 1200

; Path to the tts-server binary you built. Leave empty if you start tts-server.
server_bin          = ./qwentts.cpp/build/tts-server
codec               = models/qwen-tokenizer-12hz-Q8_0.gguf
port                = 7096

; The bot hot-swaps its whole behavior (commands, storage, request format) based on
; which talker file this points to. Detection is automatic from the file name
; ("customvoice" or "voicedesign" must appear in it); if you rename the file, set
; 'mode' explicitly instead. Only one mode is active per run - switching means
; changing this and restarting the bot, not running both at once.
talker              = models/qwen-talker-1.7b-customvoice-Q8_0.gguf ; models/qwen-talker-1.7b-voicedesign-Q8_0.gguf

; Uncomment only if the talker's file name doesn't contain "customvoice"/"voicedesign":
; mode                = customvoice

[Admin]
admin_ids           = admin_id1, admin_id2
restricted_voices   = voice_name, voice_name1
authorized_users    = user_for_voice_name, user_for_voice_name1